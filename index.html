      -webkit-overflow-scrolling: touch;

    }
    
/* Placeholder comment to make sure github notice the change*/

    /* Prevent iOS Input Auto-Zoom */
    @media screen and (max-width: 768px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .animate-shake { animation: shake 0.5s ease-in-out; }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    
    @keyframes slideInRight {
      from { transform: translateX(20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .slide-in-from-right-4 { animation: slideInRight 0.4s ease-out forwards; }
    
    @keyframes slideInTop {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .slide-in-from-top-4 { animation: slideInTop 0.4s ease-out forwards; }

    @keyframes slideInBottom {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .slide-in-from-bottom-8 { animation: slideInBottom 0.5s ease-out forwards; }

    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .zoom-in-95 { animation: zoomIn 0.3s ease-out forwards; }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

    function showLoader(show) {

    function toggleSidebar(forceShow) {
      state.showSidebar = forceShow !== undefined ? forceShow : !state.showSidebar;
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      
      if (state.showSidebar) {
        sidebar.classList.remove('translate-x-full');
        sidebar.classList.add('translate-x-0');
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        backdrop.classList.add('opacity-100', 'pointer-events-auto');
        document.body.style.overflow = 'hidden';
        renderSidebarContent();
      } else {
        sidebar.classList.add('translate-x-full');
        sidebar.classList.remove('translate-x-0');
        backdrop.classList.add('opacity-0', 'pointer-events-none');
        backdrop.classList.remove('opacity-100', 'pointer-events-auto');
        document.body.style.overflow = '';
        setTimeout(() => changeAuthMode('menu'), 500);
      }
    }

    function toggleTheme() {
      state.darkMode = !state.darkMode;
      document.documentElement.classList.toggle('dark', state.darkMode);
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.innerHTML = state.darkMode ? '<i data-lucide="sun" class="w-5 h-5 text-yellow-500"></i>' : '<i data-lucide="moon" class="w-5 h-5"></i>';
        lucide.createIcons({root: btn});
      }
    }

    }

    function toggleCategory(id) {
      const hasFilters = Object.values(state.filters).some(val => val !== '');
      if (state.searchQuery.length > 0 || hasFilters) return; // Prevent collapse animation during search or active filters
      
      const wasExpanded = state.expandedCategoryId;
      state.expandedCategoryId = state.expandedCategoryId === id ? null : id;
      
      if (wasExpanded && wasExpanded !== id) {
         updateCategoryDOM(wasExpanded, false);
      }
      
      if (state.expandedCategoryId) {
         updateCategoryDOM(id, true);
      } else {
         updateCategoryDOM(id, false);
      }
    }

    function updateCategoryDOM(id, isExpanded) {
       const container = document.getElementById('cat-container-' + id);
       const iconCont = document.getElementById('cat-icon-container-' + id);
       const title = document.getElementById('cat-title-' + id);
       const chevron = document.getElementById('cat-chevron-' + id);
       const wrapper = document.getElementById('cat-content-wrapper-' + id);
       
       if(!container || !iconCont || !title || !chevron || !wrapper) return;
       
       if (isExpanded) {
          container.classList.remove('border-slate-800/10', 'dark:border-[#222]');
          container.classList.add('border-yellow-500', 'shadow-lg');
          iconCont.classList.remove('text-slate-500', 'dark:text-slate-400');
          iconCont.classList.add('text-yellow-500');
          title.classList.add('text-yellow-600');
          chevron.classList.remove('opacity-20');
          chevron.classList.add('rotate-180', 'text-yellow-500');
          wrapper.classList.remove('grid-rows-[0fr]', 'opacity-0');
          wrapper.classList.add('grid-rows-[1fr]', 'opacity-100');
       } else {
          container.classList.add('border-slate-800/10', 'dark:border-[#222]');
          container.classList.remove('border-yellow-500', 'shadow-lg');
          iconCont.classList.add('text-slate-500', 'dark:text-slate-400');
          iconCont.classList.remove('text-yellow-500');
          title.classList.remove('text-yellow-600');
          chevron.classList.add('opacity-20');
          chevron.classList.remove('rotate-180', 'text-yellow-500');
          wrapper.classList.add('grid-rows-[0fr]', 'opacity-0');
          wrapper.classList.remove('grid-rows-[1fr]', 'opacity-100');
       }
    }

      if (formatted.length > 6) formatted = formatted.substring(0, 6) + '-' + formatted.substring(6);
      if (formatted.length > 9) formatted = formatted.substring(0, 9) + '-' + formatted.substring(9);
      input.value = formatted;
      state.form.authIdentity = formatted;

    function itemMatchesFilters(item, catTitle, filters) {
        const text = (catTitle + " " + item.en + " " + (item.desc || "")).toLowerCase();
        let matches = true;

        if (filters.marital === 'married') matches = matches && /(ibu bersalin|bib|endowment|efs|marriage|married|kahwin|poligami|ruju|anak|isteri|suami)/i.test(text);
        if (filters.marital === 'divorced') matches = matches && /(divorce|widow|cerai|iddah|fasakh|khulu|ta'liq|zihar|nusyuz|janda|duda)/i.test(text);
        if (filters.marital === 'single') matches = matches && /(scholarship|biasiswa|student|job|pinjaman|youth|aids|sekolah|bujang)/i.test(text);

        if (filters.age === 'child') matches = matches && /(endowment|efs|school|student|child|anak|sekolah)/i.test(text);
        if (filters.age === 'adult') matches = matches && /(i - gps|biasiswa|job|marriage|business|licence|permit|contractor|water|land|strata|kahwin|dewasa)/i.test(text);
        if (filters.age === 'senior') matches = matches && /(kenyalang|kgc|senior|schb|warga emas)/i.test(text);

        if (filters.employment === 'student') matches = matches && /(biasiswa|pinjaman|student|school|i - gps|tuition|sekolah)/i.test(text);
        if (filters.employment === 'unemployed') matches = matches && /(geran pelancaran|gp|skas|bantuan|welfare|aids|kebajikan)/i.test(text);
        if (filters.employment === 'employed') matches = matches && /(business|trade|procurement|wireman|pipe fitter|contractor|licence|permit|water|land|pekerja)/i.test(text);

        if (filters.income === 'b40') matches = matches && /(skas|senior|schb|public housing|bantuan|aids|welfare|kebajikan)/i.test(text);
        if (filters.income === 'm40') matches = matches && /(pinjaman|water|land|hydro|utilities)/i.test(text);
        if (filters.income === 't20') matches = matches && /(business|trade|permit|licence|premium|strata|contractor)/i.test(text);

        return matches;
    }

    // --- Action Handlers ---
    window.handleVerifyIdentity = async (e) => {
      e.preventDefault();
      syncFormToState('authIdentityInput', 'authIdentity');
      showLoader(true);
      try {
        const inputStr = state.form.authIdentity.trim().toLowerCase();
        let found = null;

        // Search admins by email or id
        const { data: adminByEmail } = await db.from('admins').select('*').ilike('email', inputStr).limit(1);
        const { data: adminById } = (!adminByEmail || !adminByEmail.length)
          ? await db.from('admins').select('*').ilike('id', inputStr).limit(1)
          : { data: null };
        const adminRow = (adminByEmail && adminByEmail[0]) || (adminById && adminById[0]);
        if (adminRow) {
          found = {
            ...adminRow,
            securityName: adminRow.security_name,
            permanentAddress: adminRow.permanent_address,
            correspondenceAddress: adminRow.correspondence_address,
            isAdmin: true, applications: [], loginHistory: []
          };
        }

        // Search citizens by IC, username or email
        if (!found) {
          const { data: byIC } = await db.from('citizens').select('*').ilike('ic', inputStr).limit(1);
          const { data: byUser } = (!byIC || !byIC.length)
            ? await db.from('citizens').select('*').ilike('username', inputStr).limit(1)
            : { data: null };
          const { data: byEmail } = (!byIC || !byIC.length) && (!byUser || !byUser.length)
            ? await db.from('citizens').select('*').ilike('email', inputStr).limit(1)
            : { data: null };
          const citizenRow = (byIC && byIC[0]) || (byUser && byUser[0]) || (byEmail && byEmail[0]);
          if (citizenRow) {
            const [{ data: apps }, { data: loginHist }] = await Promise.all([
              db.from('applications').select('*').eq('citizen_id', citizenRow.id),
              db.from('login_history').select('*').eq('user_id', citizenRow.id).order('logged_in_at', { ascending: false }).limit(20)
            ]);
            found = {
              ...citizenRow,
              securityName: citizenRow.security_name,
              permanentAddress: citizenRow.permanent_address,
              correspondenceAddress: citizenRow.correspondence_address,
              profileImage: citizenRow.profile_image,
              imageScale: citizenRow.image_scale || 1,
              applications: (apps || []).map(a => ({ id: a.id, name: a.name, status: a.status, date: a.date })),
              loginHistory: (loginHist || []).map(l => ({ time: new Date(l.logged_in_at).toLocaleString(), device: l.device }))
            };
          }
        }

        showLoader(false);
        if (!found) {
          const looksLikeEmail = inputStr.includes('@');
          state.authError = looksLikeEmail
            ? 'Email not found. Try logging in with your IC number (e.g. 980404-13-5567) or username instead.'
            : UI_TEXT.authErrorNotFound;
          renderSidebarContent(); return;
        }
        state.matchedUser = found;
        state.isIdentityVerified = true;
        renderSidebarContent();
      } catch (err) {
        console.error('Verify identity error:', err);
        showLoader(false);
        state.authError = 'Connection error. Check your Supabase configuration.';
        renderSidebarContent();
      }
    };

    window.handleLoginSubmit = async (e) => {
      e.preventDefault();
      syncFormToState('authIdentityInput', 'authIdentity');
      syncFormToState('authPasswordInput', 'authPassword');
      showLoader(true);
      try {
        let loginOk = false;
        if (state.matchedUser) {
          if (state.matchedUser.isAdmin) {
            // Admin uses custom password check (not Supabase Auth)
            loginOk = state.matchedUser.password === state.form.authPassword;
          } else {
            // Citizens authenticate through Supabase Auth
            const { error: signInErr } = await db.auth.signInWithPassword({
              email: state.matchedUser.email,
              password: state.form.authPassword
            });
            if (signInErr) console.error('Supabase Auth sign-in error:', signInErr);
            loginOk = !signInErr;
          }
        }

        if (loginOk) {
          const loginRecord = { time: new Date().toLocaleString(), device: getDevice() };
          state.matchedUser.loginHistory = [loginRecord, ...(state.matchedUser.loginHistory || [])];

          // Record login to Supabase (fire-and-forget)
          db.from('login_history').insert({
            user_id: state.matchedUser.id,
            user_type: state.matchedUser.isAdmin ? 'admin' : 'citizen',
            device: getDevice()
          }).then(({ error }) => { if (error) console.error('Login history error:', error); });

          state.currentUser = state.matchedUser;
          state.isLoggedIn = true;
          state.isAdmin = !!state.matchedUser.isAdmin;

          if (state.isAdmin) {
            state.adminActiveTab = 'citizens';
            // Load all citizens, applications, login history and bug reports for admin panel
            const [
              { data: allCitizens },
              { data: allApps },
              { data: allLoginHist },
              { data: allBugs }
            ] = await Promise.all([
              db.from('citizens').select('*'),
              db.from('applications').select('*'),
              db.from('login_history').select('*').eq('user_type', 'citizen').order('logged_in_at', { ascending: false }),
              db.from('bug_reports').select('*').order('created_at', { ascending: false })
            ]);
            state.citizens = (allCitizens || []).map(c => ({
              ...c,
              securityName: c.security_name,
              permanentAddress: c.permanent_address,
              correspondenceAddress: c.correspondence_address,
              profileImage: c.profile_image,
              imageScale: c.image_scale || 1,
              applications: (allApps || []).filter(a => a.citizen_id === c.id).map(a => ({ id: a.id, name: a.name, status: a.status, date: a.date })),
              loginHistory: (allLoginHist || []).filter(l => l.user_id === c.id).map(l => ({ time: new Date(l.logged_in_at).toLocaleString(), device: l.device }))
            }));
            state.bugReports = (allBugs || []).map(b => ({
              id: b.id, desc: b.description, screenshot: b.screenshot,
              user: b.citizen_id, time: new Date(b.created_at).toLocaleString()
            }));
          }

          showLoader(false);
          toggleSidebar(false);
          renderAdminPanels();
          renderCatalog();
        } else {
          showLoader(false);
          state.authError = UI_TEXT.authErrorWrongCreds;
          renderSidebarContent();
        }
      } catch (err) {
        console.error('Login error:', err);
        showLoader(false);
        state.authError = `Login failed: ${err.message || 'Please try again.'}`;
        renderSidebarContent();
      }
    };

    window.handleLogout = () => {

      db.from('citizens').update({

    window.handleChangePassword = () => {
      syncFormToState('cpNewPass', 'authPassword');
      syncFormToState('cpConfPass', 'confirmPassword');
      
      if (!state.form.authPassword) {
        state.authError = "Password cannot be empty."; renderSidebarContent(); return;
      }
      const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#-_])[A-Za-z\d@$!%*?&#-_]{8,}$/;
      if (!regex.test(state.form.authPassword)) { state.authError = "New password does not meet requirements."; renderSidebarContent(); return; }
      if (state.form.authPassword !== state.form.confirmPassword) { state.authError = "Passwords mismatch."; renderSidebarContent(); return; }
      
      const newPass = state.form.authPassword;
      const tableToUpdate = state.currentUser.isAdmin ? 'admins' : 'citizens';
      db.from(tableToUpdate).update({ password: newPass }).eq('id', state.currentUser.id)

    window.handleSignupSubmit = async (e) => {
      e.preventDefault();
      
      if (state.signUpStep === 1) {
        syncFormToState('suIC', 'authIdentity'); syncFormToState('suName', 'authName');
        syncFormToState('suRace', 'authRace'); syncFormToState('suReligion', 'authReligion');
        syncFormToState('suGender', 'authGender'); syncFormToState('suUser', 'authUsername'); syncFormToState('suEmail', 'emailAddress');
        syncFormToState('suMobile', 'mobilePhone');
        syncFormToState('suPerm', 'permanentAddress'); syncFormToState('suCorr', 'correspondenceAddress');

        if (!state.form.authName || !state.form.authIdentity || !state.form.authRace || !state.form.authReligion || !state.form.authGender || !state.form.authUsername || !state.form.mobilePhone || !state.form.emailAddress || !state.form.permanentAddress || !state.form.correspondenceAddress) {
          state.authError = "Please fill in all details to proceed.";
          renderSignupModal(); return;
        }
        if (state.form.mobilePhone.length < 8) { state.authError = "Invalid mobile."; renderSignupModal(); return; }
        state.authError = null; state.signUpStep = 2; renderSignupModal(); return;
      }
      
      if (state.signUpStep === 2) {
        syncFormToState('suPass', 'authPassword'); syncFormToState('suConf', 'confirmPassword'); syncFormToState('suSecName', 'authSecurityName');
        if (!state.form.authSecurityName) { state.authError = "Security phrase is required."; renderSignupModal(); return; }
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#-_])[A-Za-z\d@$!%*?&#-_]{8,}$/;
        if (!regex.test(state.form.authPassword)) { state.authError = "Requirements: 8+ chars, upper, lower, number, symbol."; renderSignupModal(); return; }
        if (state.form.authPassword !== state.form.confirmPassword) { state.authError = "Passwords mismatch."; renderSignupModal(); return; }
        state.authError = null; state.signUpStep = 3; renderSignupModal(); return;
      }
      
      if (state.signUpStep === 3) {
        showLoader(true);
        try {
          const newId = `KC-${state.form.authIdentity.replace(/-/g, '')}`;

          // 1. Register with Supabase Auth (shows user in Dashboard > Authentication > Users)
          const { error: authErr } = await db.auth.signUp({
            email: state.form.emailAddress,
            password: state.form.authPassword,
            options: { data: { citizen_id: newId, ic: state.form.authIdentity } }
          });
          if (authErr) {
            if (authErr.message.toLowerCase().includes('already registered') || authErr.message.toLowerCase().includes('user already registered')) {
              // Auth account exists but citizens row may be missing (partial previous signup).
              // Verify password ownership then continue to DB insert.
              const { error: verifyErr } = await db.auth.signInWithPassword({
                email: state.form.emailAddress,
                password: state.form.authPassword
              });
              if (verifyErr) {
                showLoader(false);
                state.authError = 'An account with this email already exists. Please log in instead.';
                renderSignupModal(); return;
              }
              await db.auth.signOut();
              // Password verified — fall through to DB insert below
            } else {
              showLoader(false);
              state.authError = `Sign up failed: ${authErr.message}`;
              renderSignupModal(); return;
            }
          }

          // 2. Upload profile photo to Supabase Storage bucket 'profiles'
          let profileImageUrl = null;
          if (state.form.signupProfileFile) {
            const ext = (state.form.signupProfileFile.name.split('.').pop() || 'jpg').toLowerCase();
            const filePath = `${newId}/photo.${ext}`;
            const { error: upErr } = await db.storage
              .from('profiles')
              .upload(filePath, state.form.signupProfileFile, { upsert: true, contentType: state.form.signupProfileFile.type });
            if (!upErr) {
              const { data: urlData } = db.storage.from('profiles').getPublicUrl(filePath);
              profileImageUrl = urlData.publicUrl;
            } else {
              console.error('Profile image upload error:', upErr);
            }
          }

          // 3. Insert citizen row to database
          const { error: insertErr } = await db.from('citizens').insert({
            id: newId,
            name: state.form.authName,
            ic: state.form.authIdentity,
            username: state.form.authUsername,
            password: state.form.authPassword,
            race: state.form.authRace,
            religion: state.form.authReligion,
            gender: state.form.authGender,
            mobile: state.form.mobilePhone,
            email: state.form.emailAddress,
            security_name: state.form.authSecurityName,
            permanent_address: state.form.permanentAddress,
            correspondence_address: state.form.correspondenceAddress,
            profile_image: profileImageUrl
          });
          if (insertErr) {
            console.error('Signup DB error:', insertErr);
            showLoader(false);
            if (insertErr.code === '23505') {
              // A row with this IC or username already exists — find it so we can guide the user
              const { data: existing } = await db.from('citizens').select('ic, username').ilike('ic', state.form.authIdentity).limit(1);
              if (existing && existing[0]) {
                state.authError = `Your profile already exists in the system. Please log in using your IC number (${state.form.authIdentity}) or username instead of email.`;
              } else {
                state.authError = 'Username is already taken. Please choose a different username and try again.';
              }
            } else {
              state.authError = `Registration failed: ${insertErr.message}`;
            }
            renderSignupModal(); return;
          }

          // 4. Record first login
          await db.from('login_history').insert({ user_id: newId, user_type: 'citizen', device: getDevice() });

          const newCit = {
            id: newId, ic: state.form.authIdentity, name: state.form.authName,
            username: state.form.authUsername, password: state.form.authPassword,
            race: state.form.authRace, religion: state.form.authReligion, gender: state.form.authGender,
            permanentAddress: state.form.permanentAddress, correspondenceAddress: state.form.correspondenceAddress,
            mobile: state.form.mobilePhone, email: state.form.emailAddress,
            securityName: state.form.authSecurityName,
            profileImage: profileImageUrl,
            imageScale: 1,
            applications: [], loginHistory: [{ time: new Date().toLocaleString(), device: getDevice() }]
          };
          state.form.signupProfileImage = null;
          state.form.signupProfileFile = null;
          state.citizens.push(newCit);
          state.currentUser = newCit; state.isLoggedIn = true;
          showLoader(false); toggleSignUp(false);
          renderCatalog();
        } catch (err) {
          console.error('Signup error:', err);
          showLoader(false);
          state.authError = `Registration failed: ${err.message || 'Please try again.'}`;
          renderSignupModal();
        }
      }
    };

    function renderCatalog() {
      const searchContainer = document.getElementById('search-container');
      const catalogContainer = document.getElementById('catalog-panels');
      
      if (state.isAdmin) {
        if(searchContainer) searchContainer.style.display = 'none';
        catalogContainer.innerHTML = '';
        return;
      }
      
      if(searchContainer) searchContainer.style.display = 'block';

      const sq = state.searchQuery.toLowerCase();
      const hasFilters = Object.values(state.filters).some(val => val !== '');
      
      const filteredServices = state.services.map(cat => {
        const titleMatch = sq ? cat.title.en.toLowerCase().includes(sq) : false;
        
        const matchedItems = cat.items.filter(it => {
          let searchMatch = true;
          if (sq && !titleMatch) {
            searchMatch = it.en.toLowerCase().includes(sq) || (it.desc && it.desc.toLowerCase().includes(sq));
          }
          
          let filterMatch = true;
          if (hasFilters) {
             filterMatch = itemMatchesFilters(it, cat.title.en, state.filters);
          }
          
          return searchMatch && filterMatch;
        });

        const finalItems = (titleMatch && !hasFilters) ? cat.items : matchedItems;
        return { ...cat, items: finalItems, titleMatch };
      }).filter(cat => cat.items.length > 0 || (cat.titleMatch && !hasFilters));

      const studentServices = filteredServices.filter(s => s.group === "student");
      const sarawakServices = filteredServices.filter(s => s.group === "service");

      let html = `<div class="space-y-16">`;

      const renderCategory = (cat) => {
        const isExpanded = state.expandedCategoryId === cat.id || sq.length > 0 || hasFilters;
        const filteredItems = cat.items;

        let itemsHtml = '';
        if (filteredItems && filteredItems.length > 0) {
           itemsHtml = filteredItems.map(item => `
             <div class="p-4 border-b border-slate-500/10 dark:border-[#222] group last:border-none">
               ${item.link !== "#" 
                 ? `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="font-black uppercase text-sm block hover:text-yellow-600 transition-colors text-blue-600 dark:text-blue-400 leading-tight">${item.en}</a>`
                 : `<span class="font-black uppercase text-sm block text-slate-500 dark:text-slate-400 cursor-not-allowed leading-tight">${item.en}</span>`
               }
               <p class="text-[10px] opacity-60 italic text-slate-600 dark:text-slate-400 mt-2">
                 ${item.link === "#" ? (item.desc || "Link Not Available") : "Online Portal Available"}
               </p>
             </div>
           `).join('');
        } else {
           itemsHtml = `<p class="text-xs opacity-40 text-center py-4 font-bold">No matching services found within this category.</p>`;
        }

        return `
          <div id="cat-container-${cat.id}" class="rounded-[2.5rem] border-2 transition-all duration-500 overflow-hidden ${isExpanded ? 'border-yellow-500 shadow-lg' : 'border-slate-800/10 dark:border-[#222]'}">
            <div onclick="toggleCategory(${cat.id})" class="p-6 md:p-8 cursor-pointer flex items-center gap-6 md:gap-8 hover:bg-slate-50 dark:hover:bg-[#111] transition-colors">
              <div id="cat-icon-container-${cat.id}" class="flex-shrink-0 flex items-center justify-center transition-colors duration-500 ${isExpanded ? 'text-yellow-500' : 'text-slate-500 dark:text-slate-400'}">
                <i data-lucide="${getIcon(cat.icon)}" class="w-6 h-6 md:w-7 md:h-7"></i>
              </div>
              <div class="flex-grow">
                <h3 id="cat-title-${cat.id}" class="font-black text-base md:text-lg uppercase transition-colors duration-500 ${isExpanded ? 'text-yellow-600' : ''}">${cat.title.en}</h3>
              </div>
              <span id="cat-chevron-${cat.id}" class="transition-transform duration-500 flex items-center justify-center ${isExpanded ? 'rotate-180 text-yellow-500' : 'opacity-20'}">
                <i data-lucide="chevron-down" class="w-6 h-6 md:w-7 md:h-7"></i>
              </span>
            </div>
            
            <div id="cat-content-wrapper-${cat.id}" class="grid transition-all duration-500 ease-in-out ${isExpanded ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}">
              <div class="overflow-hidden">
                <div class="px-6 md:px-8 pb-10 space-y-4 text-left border-t border-slate-500/10 dark:border-[#222] pt-4 bg-slate-50/50 dark:bg-[#0a0a0a]">
                  ${itemsHtml}
                </div>
              </div>
            </div>
          </div>
        `;
      };

      if (studentServices.length > 0) {
        html += `
          <div class="space-y-6 text-left px-2 md:px-4">
            <h2 class="text-2xl md:text-3xl font-black uppercase flex items-center gap-4"><i data-lucide="graduation-cap" class="text-yellow-600 w-8 h-8"></i> School & Student</h2>
            <div class="space-y-4">
              ${studentServices.map(renderCategory).join('')}
            </div>
          </div>
        `;
      }

      if (sarawakServices.length > 0) {
        html += `
          <div class="space-y-6 text-left px-2 md:px-4 mt-16">
            <h2 class="text-2xl md:text-3xl font-black uppercase flex items-center gap-4"><i data-lucide="globe" class="text-yellow-600 w-8 h-8"></i> Service Sarawak</h2>
            <div class="space-y-4">
              ${sarawakServices.map(renderCategory).join('')}
            </div>
          </div>
        `;
      }
      
      if (studentServices.length === 0 && sarawakServices.length === 0) {
        html += `<div class="py-20 text-center opacity-40"><i data-lucide="file-search" class="w-16 h-16 mx-auto mb-4"></i><p class="font-black uppercase tracking-widest text-sm">No services matched your search or filters.</p></div>`;
      }

      html += `</div>`;
      catalogContainer.innerHTML = html;
      lucide.createIcons();
    }

                  <p class="text-[9px] opacity-40 italic px-4">Must be 8+ characters, include upper/lowercase, number, and symbol.</p>
                </div>
                <div class="space-y-4 text-left">
                  <label class="text-xs font-black uppercase opacity-40 px-2">Confirm Password</label>
                  <div class="relative">
                    <input required type="password" id="suConf" value="${state.form.confirmPassword}" class="w-full p-6 pr-14 rounded-[2rem] border-2 border-slate-500/20 dark:border-[#333] font-black outline-none bg-transparent focus:border-yellow-500 text-2xl" />
                    <button type="button" id="btn-su-conf" onclick="togglePasswordVisibility('suConf', 'btn-su-conf')" class="absolute right-6 top-1/2 -translate-y-1/2 opacity-40 hover:opacity-100 transition-opacity"><i data-lucide="eye" class="w-6 h-6"></i></button>
                  </div>
                </div>
                <button type="submit" class="w-full py-8 rounded-[2.5rem] bg-yellow-500 text-black font-black uppercase tracking-widest shadow-xl transform active:scale-95 text-xl">Continue to Final Review</button>
                <button type="button" onclick="state.signUpStep=1; renderSignupModal();" class="w-full py-4 text-[10px] font-black uppercase opacity-40">Back to Details</button>
             </form>
          </div>
        `;
      }
      else if (state.signUpStep === 3) {
        html = `
          <div class="animate-in zoom-in-95 py-32 text-center max-w-2xl mx-auto">
             <i data-lucide="shield-alert" class="w-24 h-24 text-red-500 mx-auto mb-10 animate-pulse"></i>
             <h3 class="text-5xl font-black uppercase mb-8">Ready to Start?</h3>
             ${state.authError ? `<div class="mb-10 p-6 rounded-3xl bg-red-500/10 border border-red-500/20 text-red-500 text-xs font-black uppercase flex items-center gap-4 animate-shake text-left"><i data-lucide="alert-triangle" class="w-6 h-6 shrink-0"></i> ${state.authError}</div>` : ''}
             <div class="p-10 rounded-[3rem] border-2 border-red-500/20 bg-red-500/5 mb-10 text-left shadow-inner dark:bg-[#111] dark:border-red-500/30"><p class="text-lg font-medium leading-relaxed opacity-80 text-justify">${UI_TEXT.signUpWarning}</p></div>
             <button onclick="handleSignupSubmit(event)" class="w-full py-8 rounded-[2.5rem] bg-black text-white dark:bg-white dark:text-black font-black uppercase tracking-widest shadow-2xl hover:scale-[1.02] active:scale-95 transition-all text-xl text-center">Agree & Enter Homepage</button>
             <button type="button" onclick="state.signUpStep=2; renderSignupModal();" class="w-full py-4 text-[10px] font-black uppercase opacity-40 mt-4">Back to Security</button>
          </div>
        `;
      }

      container.innerHTML = html;
      lucide.createIcons();
    }

    // --- Initialization & Loop ---
    function init() {
      renderSidebarContent();
      renderCatalog();
    }

    // Bootstrap app
    window.addEventListener('DOMContentLoaded', init);

  </script>

  <!-- Full Screen Image Modal for Admin Bug Viewing -->
  <div id="image-modal" class="fixed inset-0 z-[300] flex items-center justify-center p-8 bg-black/90 backdrop-blur-md cursor-pointer" style="display: none;" onclick="this.style.display='none'">
    <img id="image-modal-img" src="" class="max-w-full max-h-full rounded-2xl shadow-2xl animate-in zoom-in-95 duration-300 object-contain" />
    <p class="absolute bottom-8 text-white font-black uppercase tracking-widest text-xs opacity-50">Click anywhere to close</p>
  </div>
</body>
</html>
